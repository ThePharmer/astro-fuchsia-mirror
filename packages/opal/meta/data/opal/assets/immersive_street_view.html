<!-- Template for displaying immersive Street View. This template will be displayed within
HtmlView class. The HtmlView class provides a wrapper to allow JavaScript callbacks for sending
VisualElement events. As such, this HTML represents the body of content to be displayed but not
an entire HTML page.

The following strings must be replaced (all with leading and trailing __)
    MAPS_API_KEY - production (or temporary) key to use for Maps API
    PLACE_NAME - name to display in overlay
    ASSIGN_VARIABLES - JavaScript to set the variables to set primary location and boundary.
      Each location has a lat and lng value.
        center
    -->
<style>
 body {
  height: 100%;
  display: flex;
  flex-direction: column-reverse;
  text-align: center;
 }
 html, body {
  height: 100%;
 }
 p {
  font-family: 'Google Sans', 'Noto Sans', Arial, sans-serif;
  margin-top: 4px;
  margin-bottom: 4px;
  z-index: 3;
 }
 .border {
  background-color: rgba(32, 33, 36, 0.9);
  color: #fff;
  padding: 12px 48px;
  border-radius: 48px;
  display:inline-block;
   z-index: 3;
 }
 .bottom {
  height: 100%;
  display: flex;
  flex-direction: column-reverse;
  background-color: transparent;
  align-items: center;
  padding: 56px 10px;
 }
 .place-name {
  font-size: 24px;
  font-weight: 600;
 }
 .mode_display {
  font-size: 20px;
  font-weight: 500;
 }
 #pano {
  background-color: rgba(255, 255, 255, 1);
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 1;
 }
</style>
<div id="pano" style="map"></div>
<div class="bottom">
  <div class="border">
    <p class=place-name>__PLACE_NAME__</p>
    <p class=mode_display>360° view</p>
  </div>
</div>
<script>
 var center;
__ASSIGN_VARIABLES__
 function initPano() {
  var panorama = new google.maps.StreetViewPanorama(
   document.getElementById('pano'), {
    position: center,
    linksControl: false,
    panControl: false,
    enableCloseButton: false,
    zoomControl: false,
    addressControl: false,
    motionTrackingControl: false,
    fullscreenControl: false,
  });
 }
</script>
<script async defer
 src="https://maps.googleapis.com/maps/api/js?key=__MAPS_API_KEY__&callback=initPano">
</script>
