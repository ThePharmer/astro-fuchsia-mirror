<!-- Template for displaying immersive Map. The following strings must be replaced.
    OVERLAY_VISIBILITY - 'visible' or 'hidden' to show/hide the overlay
    PLACE_NAME - name to display in overlay
    PLACE_ADDRESS - address to display in overlay
    ASSIGN_VARIABLES - JavaScript to set the variables to set primary location and boundary.
      Each location has a lat and lng value.
        center
        northEast
        southWest
    -->
<style>
 body {
  height: 100%;
  display: flex;
  flex-direction: column-reverse;
  text-align: center;
 }
 html, body {
  height: 100%;
 }
 p {
  font-family: 'Google Sans', 'Noto Sans', Arial, sans-serif;
  margin-top: 4px;
  margin-bottom: 4px;
  z-index: 3;
 }
 .border {
  background-color: rgba(32, 33, 36, 0.9);
  color: #fff;
  padding: 12px 48px;
  border-radius: 48px;
  display:inline-block;
   z-index: 3;
 }
 .bottom {
  height: 100%;
  display: flex;
  flex-direction: column-reverse;
  background-color: transparent;
  align-items: center;
  padding: 24px 10px;
  visibility: <!--OVERLAY_VISIBILITY-->;
 }
 .place-name {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
 }
 .place-address {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.5;
 }
 #map {
  background-color: rgba(255, 255, 255, 1);
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 1;
 }
</style>
<div id="map" style="map"></div>
<div class="bottom">
  <div class="border">
    <p class=place-name><!--PLACE_NAME--></p>
    <p class=place-address><!--PLACE_ADDRESS--></p>
  </div>
</div>
<script>
 var center, northEast, southWest, zoom = 12;
<!--ASSIGN_VARIABLES-->
 var map;
 function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
   center: center,
   zoom: zoom,
   zoomControl: false,
   mapTypeControl: false,
   streetViewControl: false,
   fullscreenControl: false
  });
  var marker = new google.maps.Marker({
   position: center,
   map: map
  });
  if (northEast && southWest) {
   var bounds = new google.maps.LatLngBounds();
   bounds.extend(northEast);
   bounds.extend(southWest);
   map.fitBounds(bounds);
  }
 }
</script>
<script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBnbASgsJlf_v3Y9NUia45Lt9Ik0YD5oxg&callback=initMap" async defer>
</script>
